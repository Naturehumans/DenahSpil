version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: spildenah-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - spildenah-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    container_name: spildenah-backend
    env_file: .env
    ports:
      - "${BACKEND_PORT}:8000"
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy
    networks:
      - spildenah-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: spildenah-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - spildenah-net

networks:
  spildenah-net:
    driver: bridge

volumes:
  postgres_data:
