<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Spil Denah</title>
    <meta name="description" content="Aplikasi Manajemen Inventori & Denah Lokasi Aset" />
    <meta name="theme-color" content="#3a9542" />
    <link rel="apple-touch-icon" href="/pwa-192x192.png" />
    <!-- Polyfill for HTML5 Drag and Drop on Mobile Devices -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/mobile-drag-drop@2.3.0-rc.2/default.css">
    <script src="https://cdn.jsdelivr.net/npm/mobile-drag-drop@2.3.0-rc.2/index.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mobile-drag-drop@2.3.0-rc.2/scroll-behaviour.min.js"></script>
    <script>
      window.addEventListener('touchmove', function() {}, {passive: false});
      // Initialize polyfill
      document.addEventListener('DOMContentLoaded', function() {
        MobileDragDrop.polyfill({
          dragImageTranslateOverride: MobileDragDrop.scrollBehaviourDragImageTranslateOverride
        });
      });
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
